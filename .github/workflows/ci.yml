name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # only a flag at job level; the secrets themselves reach the live step alone
      HAS_LIVE: ${{ secrets.E2E_SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: e2e (mocked Supabase)
        run: npm run e2e
      # Against the staging project in the E2E_SUPABASE_* secrets (injected as window.IB_CONFIG), never app/config.js.
      - name: e2e (live staging Supabase, only when the E2E_* secrets exist)
        if: env.HAS_LIVE == 'true'
        run: npm run e2e
        env:
          E2E_SUPABASE_LIVE: '1'
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PW: ${{ secrets.E2E_ADMIN_PW }}
          E2E_OPS_PW: ${{ secrets.E2E_OPS_PW }}
          E2E_VIEWER_PW: ${{ secrets.E2E_VIEWER_PW }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: migrations + RLS tests
        run: npm run db:test
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/postgres

  # ERROR-level findings of the registry's JavaScript and secrets packs fail the build. Left out: app/js/blocks (prototype code,
  # reviewed by hand with the notes in the ledgers; every block edit goes through a reviewer) and app/js/vendor (pinned
  # third-party builds, js/vendor/README.md).
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install semgrep==1.182.1
      - run: npm run semgrep

  # The Edge Functions (supabase/functions): type check, then the handler tests (fake Woo and Supabase; no network but 127.0.0.1).
  # npm: / jsr: imports come from Deno's own cache (--node-modules-dir=none), as on Supabase, so no npm ci here.
  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run deno:check
      - run: npm run deno:test
