name: Deploy
# Publishes app/ as the orphan-style branch `deploy` (its root = the app/ contents, history kept via
# `git subtree split`). Hostinger's Git auto-deployment is linked to that branch for
# operation-system.ibtekr.club, so every push here deploys the site. No FTP, no secrets.
# Runs on every push to main that touches app/, and on demand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**']
permissions:
  contents: write
concurrency: deploy-branch
jobs:
  publish-deploy-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild the deploy branch from app/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=app -b deploy-tmp
          echo "deploy = $(git rev-parse --short deploy-tmp) ($(git ls-tree -r --name-only deploy-tmp | wc -l) files)"
          git push --force origin deploy-tmp:deploy
