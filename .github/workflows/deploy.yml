name: Deploy
# Uploads app/ to the Hostinger subdomain over FTPS. Runs on demand (Actions › Deploy › Run workflow)
# and on every push to main that touches app/. Needs four repository secrets (Settings › Secrets › Actions):
#   FTP_SERVER      Hostinger's own server hostname, e.g. srv1234.hstgr.io (hPanel › Hosting › Plan/Hosting details › Server).
#                   Not ftp.ibtekr.club / ibtekr.club: those resolve through Cloudflare, which does not proxy FTP (port 21).
#                   Not a bare IP either: the TLS certificate is verified against the hostname (security stays strict).
#   FTP_USERNAME    a dedicated FTP account whose home is the subdomain folder only (hPanel › FTP Accounts)
#   FTP_PASSWORD    its password
#   FTP_SERVER_DIR  the subdomain's document root as the FTP user sees it, with a trailing slash,
#                   e.g. public_html/ or domains/ibtekr.club/public_html/operation-system/
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**']
permissions:
  contents: read
concurrency: deploy-hostinger
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips cleanly (no failure) until the FTP secrets exist.
    env:
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: No FTP secrets yet
        if: env.HAS_FTP != 'true'
        run: echo "FTP_SERVER secret not set; skipping the upload (see tools/deploy.md §4.3)."
      - name: Normalize the server dir (must end with /; empty = ./)
        if: env.HAS_FTP == 'true'
        id: dir
        env:
          RAW_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          d="${RAW_DIR:-./}"
          case "$d" in */) ;; *) d="$d/";; esac
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Upload app/ over FTPS
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5 (pinned SHA)
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./app/
          server-dir: ${{ steps.dir.outputs.dir }}
          exclude: |
            **/README.md
