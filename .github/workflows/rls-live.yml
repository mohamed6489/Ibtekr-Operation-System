name: RLS live
# Runs the live-safe RLS tests against the live Supabase project through the SUPABASE_DB_URL secret: the project's
# Session-pooler connection string (Dashboard → Project Settings → Database → Connection string → Session mode —
# GitHub runners have no IPv6 and the direct host is IPv6-only; session mode keeps `set local role` working). Each file
# is one transaction that rolls back, so nothing is left behind; the URL is never printed. On demand only — the path for
# the files the Supabase MCP tool holds for approval (tools/deploy.md §2.1).
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'test names without .sql, space-separated (letters, digits, _)'
        default: 'rls_vendors rls_vendor_logins rls_brands rls_vendor_sync'
        required: false
permissions:
  contents: read
concurrency: rls-live
jobs:
  rls-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # psql: the runner's own, else apt's; when the Ubuntu archive is down (11 Nov 2026: «Temporary failure resolving
      # archive.ubuntu.com») the postgres:17 image runs it (host network, the checkout mounted at the same path)
      - name: psql
        run: |
          if command -v psql >/dev/null; then psql --version; exit 0; fi
          if timeout 300 sudo apt-get update && timeout 300 sudo apt-get install -y postgresql-client; then exit 0; fi
          docker pull -q postgres:17
          mkdir -p "$HOME/bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec docker run --rm --network host -e PGOPTIONS -v "$PWD:$PWD" -w "$PWD" postgres:17 psql "$@"' > "$HOME/bin/psql"
          chmod +x "$HOME/bin/psql"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: live-safe RLS tests (rolled back)
        run: bash tools/rls-live.sh $FILES
        env:
          FILES: ${{ inputs.files }}
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
