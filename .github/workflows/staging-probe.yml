name: Staging probe

# Manual, read-only look at the staging WooCommerce/Dokan data shape (phase 2 Task 1).
# tools/woo-probe.mjs prints one redacted JSON line per section; the keys reach that step alone.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: 'orders (the phase 2 sections), products (phase 5: shapes, meta key names, schema, totals), commission (the commission meta of a product and the rate of its store) earning (does Dokan answer a product commission / the maker earning itself) or studio (can WordPress REST set a product author, the media route, the Rank Math keys of a product) or studio2 (the product studio: attributes and terms, POST arguments of products / categories / variations, a variable product, the media route)'
        type: choice
        options: [orders, products, commission, earning, studio, studio2]
        default: orders
      product_id:
        description: 'probe=commission / earning / studio: the product id (empty = the newest)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: probe staging (GET only, personal data redacted)
        run: node tools/woo-probe.mjs
        env:
          WOO_URL: ${{ secrets.STAGING_WOO_URL }}
          WOO_CK: ${{ secrets.STAGING_WOO_CK }}
          WOO_CS: ${{ secrets.STAGING_WOO_CS }}
          PROBE: ${{ inputs.probe }}
          PROBE_ID: ${{ inputs.product_id }}
