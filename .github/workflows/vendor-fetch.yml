# Fetches a SheetJS CE build from the official CDN and commits it under app/js/vendor/ (the Claude sandbox cannot
# reach cdn.sheetjs.com, and npm stops at the vulnerable 0.18.5). Manual, pinned, hash printed in the log and
# recorded in app/js/vendor/README.md by the task that uses it.
name: Vendor fetch (SheetJS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SheetJS CE version (e.g. 0.20.3) or 'latest'"
        required: true
        default: "0.20.3"
      branch:
        description: "Branch to commit the file to"
        required: true
        default: "main-gha10e"
      sha256:
        description: "Expected sha256 of the file (optional; the run fails on a mismatch)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: download from cdn.sheetjs.com
        env:
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+|latest)$ ]] || { echo "bad version"; exit 1; }
          mkdir -p app/js/vendor
          url="https://cdn.sheetjs.com/xlsx-${VERSION}/package/dist/xlsx.full.min.js"
          curl -fsSL --retry 3 -o app/js/vendor/xlsx.full.min.js "$url"
          test -s app/js/vendor/xlsx.full.min.js
          head -c 200 app/js/vendor/xlsx.full.min.js | grep -q "xlsx" || { echo "unexpected content"; exit 1; }
          # Never execute the downloaded bundle here (this job can push). The version is the requested one, or for
          # 'latest' the SheetJS 0.x `version:"…"` string (the codepage table's 1.x string comes first in the file).
          if [[ "$VERSION" == "latest" ]]; then
            ver=$(grep -oE 'version:"0\.[0-9]+\.[0-9]+"' app/js/vendor/xlsx.full.min.js | head -1 | cut -d'"' -f2)
          else
            ver="$VERSION"
            grep -q "version:\"${VERSION}\"" app/js/vendor/xlsx.full.min.js || { echo "bundle does not carry version ${VERSION}"; exit 1; }
          fi
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version string"; exit 1; }
          sha=$(sha256sum app/js/vendor/xlsx.full.min.js | cut -d' ' -f1)
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "bad hash"; exit 1; }
          if [[ -n "${EXPECTED_SHA256}" && "${EXPECTED_SHA256}" != "$sha" ]]; then echo "sha256 mismatch: expected ${EXPECTED_SHA256}"; exit 1; fi
          echo "VENDOR xlsx.full.min.js version=${ver} sha256=${sha} source=${url}"
          echo "ver=${ver}" >> "$GITHUB_ENV"
          echo "sha=${sha}" >> "$GITHUB_ENV"
      - name: commit
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "bad branch name"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/js/vendor/xlsx.full.min.js
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore(vendor): SheetJS CE ${ver} from cdn.sheetjs.com (sha256 ${sha})"
          git push origin "HEAD:${BRANCH}"
