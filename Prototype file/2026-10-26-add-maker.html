<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إضافة مبتكر — إبتكر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap">
<style>
/* Tokens — names mirror Figma variables (color/bg/base -> --color-bg-base) */
:root{
  --color-bg-layout:#fff3e6;--color-bg-base:#fff7ef;--color-bg-container:#f5eddc;--color-bg-tint:#f0e5cf;--color-bg-elevated:#fff7ef;--color-bg-disabled:#f0e5cf;--color-bg-sidebar:#005642;
  --color-text-primary:#2e2a1b;--color-text-secondary:#6b6558;--color-text-disabled:#8f887b;--color-text-on-action:#fff7ef;--color-text-on-brand:#fff7ef;--color-text-gold:#e6ba65;
  --color-action-default:#c39e57;--color-action-hover:#b28f4d;--color-brand-default:#005642;--color-brand-hover:#054b39;--color-brand-subtle-bg:#ebf1f0;
  --color-border-default:#8f887b;--color-border-subtle:#f0e5cf;--color-border-focus:#005642;
  --color-error-base:#da0001;--color-error-bg:#ffeae6;--color-error-border:#ff887a;--color-error-text:#8e0a07;
  --color-success-base:#39ac00;--color-success-text:#2d7106;--color-success-bg:#dfebd3;--color-success-border:#93d164;
  --color-warning-base:#bc8000;--color-warning-bg:#fcf9e3;--color-warning-border:#e3c96d;
  --color-orange-base:#f08a1c;--color-orange-bg:#fff0dc;--color-orange-border:#f5a04a;--color-orange-text:#8a4500;
  --color-chart-1:#005642;--color-chart-2:#c39e57;--color-chart-3:#e6ba65;--color-chart-4:#8f887b;
  --space-xs:4px;--space-sm:12px;--space-md:16px;--space-lg:24px;--space-xs2:8px;
  --radius-sm:4px;--radius-md:8px;
  --shadow-popover:0 8px 24px rgba(46,42,27,.2);
  --font:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--color-bg-layout);color:var(--color-text-primary);font-family:var(--font);font-size:14px;line-height:24px;direction:rtl;
  padding-left:0;padding-right:0}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* Type classes (Figma text styles) */
.t-h3{font-size:24px;line-height:36px;font-weight:600}
.t-h4{font-size:20px;line-height:32px;font-weight:600}
.t-h5{font-size:16px;line-height:28px;font-weight:600}
.t-body{font-size:14px;line-height:24px;font-weight:400}
.t-small{font-size:12px;line-height:20px;font-weight:400}
.t-label{font-size:14px;line-height:24px;font-weight:500}
.t-label-s{font-size:12px;line-height:20px;font-weight:500}
.t-th{font-size:14px;line-height:24px;font-weight:600}

/* App shell */
.app{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
.sidebar{background:var(--color-bg-sidebar);color:var(--color-text-on-brand);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:12px;color:var(--color-text-gold);font-weight:700;letter-spacing:.04em}
.brand small{font-weight:500;font-size:11px;color:var(--color-text-on-brand);opacity:.8}
.nav-item{height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;border:0;background:transparent;color:var(--color-text-on-brand);border-radius:var(--radius-sm);text-align:start;font-weight:500;width:100%}
.nav-item:hover{background:rgba(255,247,239,.12)}
.nav-item[aria-current=page]{background:var(--color-action-default);color:var(--color-text-on-action);font-weight:600}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:48px;background:var(--color-bg-base);border-bottom:1px solid var(--color-border-subtle);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:5}
.topbar .search{width:360px;max-width:50vw;height:32px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);background:var(--color-bg-container);color:var(--color-text-secondary);margin-inline-end:auto}
.topbar .search input{border:0;background:transparent;flex:1;min-width:0;outline:0;font-size:12px;color:var(--color-text-primary)}
.topbar .search:focus-within{border-color:var(--color-border-focus)}
.nav-item[aria-disabled=true]{opacity:.55;cursor:default}.nav-item[aria-disabled=true]:hover{background:transparent}
.topbar .user{display:flex;align-items:center;gap:8px;order:3;color:var(--color-text-primary)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--color-brand-default);color:var(--color-text-on-brand);display:grid;place-items:center;font-size:12px;font-weight:600}
.content{padding:24px;display:flex;flex-direction:column;gap:24px;min-width:0}
.page-head h1{margin:0;color:var(--color-brand-default)}
.page-head p{margin:0;color:var(--color-text-secondary)}

/* Icons / buttons */
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:var(--radius-sm);border:1px solid transparent;font-weight:500;font-size:14px;line-height:20px;white-space:nowrap}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn.lg{height:40px}
.btn-primary{background:var(--color-action-default);color:var(--color-text-on-action)}
.btn-primary:hover{background:var(--color-action-hover)}
.btn-brand{background:var(--color-brand-default);color:var(--color-text-on-brand)}
.btn-brand:hover{background:var(--color-brand-hover)}
.btn-default{background:var(--color-bg-container);border-color:var(--color-border-default);color:var(--color-text-primary)}
.btn-default:hover{border-color:var(--color-brand-default);color:var(--color-brand-default)}
.btn-text{background:transparent;color:var(--color-brand-default)}
.btn-text:hover{background:var(--color-brand-subtle-bg)}
.btn-danger{background:var(--color-error-base);color:#fff}
.btn:disabled{background:var(--color-bg-disabled);color:var(--color-text-disabled);border-color:transparent;cursor:not-allowed}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border:0;background:transparent;border-radius:var(--radius-sm);color:var(--color-text-secondary)}
.icon-btn:hover{background:var(--color-bg-container);color:var(--color-text-primary)}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--color-border-subtle);overflow-x:auto}
.tab{padding:12px 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--color-text-secondary);font-weight:400;white-space:nowrap}
.tab:hover{color:var(--color-text-primary)}
.tab[aria-selected=true]{color:var(--color-brand-default);font-weight:600;border-bottom-color:var(--color-action-default)}

/* Toolbar + fields */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.pop-anchor{position:relative;display:inline-block}
.date-field,.sort-btn{height:36px;display:inline-flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);background:var(--color-bg-container);font-weight:500}
.date-field:hover,.sort-btn:hover{border-color:var(--color-brand-default)}
.range-label{color:var(--color-text-secondary)}
.menu{position:absolute;top:calc(100% + 4px);inset-inline-start:0;min-width:100%;width:max-content;max-width:90vw;max-height:300px;overflow:auto;padding:4px;background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);box-shadow:var(--shadow-popover);z-index:30}
.menu.end{inset-inline-start:auto;inset-inline-end:0}
.opt{height:40px;display:flex;align-items:center;padding:0 12px;border-radius:var(--radius-sm);width:100%;border:0;background:transparent;text-align:start;font-size:14px;line-height:24px;gap:8px}
.opt:hover,.opt:focus-visible{background:var(--color-bg-container)}
.opt[aria-selected=true],.opt[aria-checked=true]{background:var(--color-brand-subtle-bg);color:var(--color-brand-default);font-weight:600}
.opt.danger{color:var(--color-error-text)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.flabel{font-size:14px;line-height:24px;font-weight:500}
.req{color:var(--color-error-base)}
.input,.select{height:36px;width:100%;padding:0 12px;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);background:var(--color-bg-base);font-size:14px;display:flex;align-items:center;gap:8px;text-align:start}
.select{justify-content:space-between;flex-direction:row-reverse}
.select .val{flex:1;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.select .ph{color:var(--color-text-disabled)}
.input:hover,.select:hover{border-color:var(--color-brand-default)}
.input:focus-within,.select:focus-visible{border-color:var(--color-border-focus);outline:2px solid var(--color-border-focus);outline-offset:0}
.input input{border:0;background:transparent;flex:1;min-width:0;height:100%;outline:0;direction:rtl;unicode-bidi:plaintext;text-align:right;font-size:14px;line-height:20px}
.input input::placeholder{color:var(--color-text-disabled)}
.input.err,.select.err{border-color:var(--color-error-base);background:var(--color-error-bg)}
.err-msg{font-size:12px;line-height:20px;color:var(--color-error-text)}
.help{font-size:12px;line-height:20px;color:var(--color-text-secondary)}
.input .icb{border:0;background:transparent;padding:0;display:grid;place-items:center;color:var(--color-text-secondary)}

/* Cards */
.card{background:var(--color-bg-base);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md)}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.cards.five{grid-template-columns:repeat(5,minmax(0,1fr))}
.cat-card{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cat-top{display:flex;align-items:center;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.tone-brand{--tone:var(--color-chart-1)}.tone-gold{--tone:var(--color-chart-2)}.tone-goldlight{--tone:var(--color-chart-3)}.tone-neutral{--tone:var(--color-chart-4)}
.dot{background:var(--tone)}
.cat-val{display:flex;align-items:baseline;gap:6px;color:var(--color-text-primary)}
.cat-val .unit{font-size:14px;color:var(--color-text-secondary);font-weight:500}
.bar{height:8px;border-radius:4px;background:var(--color-bg-tint);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--tone);border-radius:4px}
.bar-meta{display:flex;gap:6px;align-items:center}
.bar-meta b{color:var(--color-brand-default);font-weight:600}
.bar-meta span{color:var(--color-text-secondary)}
.sum-card{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sum-card .lab{color:var(--color-text-secondary)}

/* Tables */
.table-card{padding:0;overflow:hidden}
.table-title{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.table-title h2{margin:0}
.table-title .count{color:var(--color-text-secondary)}
.scroll-x{overflow-x:auto;min-width:0;max-width:100%}.card,.table-card,.chart-card,.charts>*,.content>*{min-width:0}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:center;padding:12px;vertical-align:middle;white-space:nowrap}
th{background:var(--color-bg-tint);color:var(--color-text-primary);border-bottom:1px solid var(--color-border-subtle);font-weight:600;line-height:24px;height:56px;white-space:normal;min-width:84px}
td{height:48px;border-top:1px solid var(--color-border-subtle)}
tbody tr:nth-child(even) td{background:var(--color-bg-container)}
tr.total td{background:var(--color-bg-tint)!important;font-weight:600}
.vendors-table th{min-width:96px}
.vendors-table td:first-child,.vendors-table th:first-child{white-space:nowrap}
.pos{color:var(--color-success-text)}.neg{color:var(--color-error-text)}
.note{padding:12px 16px;border-radius:var(--radius-sm);display:flex;gap:12px;align-items:center;justify-content:space-between;border:1px solid var(--color-border-subtle);background:var(--color-bg-container);color:var(--color-text-secondary)}
.note.success{background:var(--color-success-bg);border-color:var(--color-success-border);color:var(--color-success-text)}
.note.error{background:var(--color-error-bg);border-color:var(--color-error-border);color:var(--color-error-text)}
.note.warning{background:var(--color-warning-bg);border-color:var(--color-warning-border);color:var(--color-text-primary)}
.source{color:var(--color-text-secondary);font-size:12px;line-height:20px}
.empty{padding:40px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border-top:1px solid var(--color-border-subtle)}
.empty .t{font-weight:600}
.empty .s{color:var(--color-text-secondary)}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(46,42,27,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:520px;max-width:100%;max-height:calc(100vh - 32px);display:flex;flex-direction:column;background:var(--color-bg-base);border-radius:var(--radius-md);box-shadow:var(--shadow-popover);overflow:hidden}
.modal-h{height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--color-border-subtle);flex:none}
.modal-h h2{margin:0}
.modal-b{padding:24px;display:flex;flex-direction:column;gap:16px;overflow:auto}
.modal-f{height:72px;padding:0 24px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--color-border-subtle);flex:none}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 16px}
.kv dt{color:var(--color-text-secondary)}.kv dd{margin:0;font-weight:500}

/* Date picker */
.dp{position:absolute;z-index:40;top:calc(100% + 4px);inset-inline-start:0;background:var(--color-bg-elevated);border:1px solid var(--color-border-subtle);border-radius:var(--radius-md);box-shadow:var(--shadow-popover)}
.dp.single{width:288px;padding:12px}
.dp.range{width:782px;max-width:calc(100vw - 32px);display:flex;flex-direction:column}
.dp-body{display:flex;min-height:0}
.presets{width:220px;flex:none;padding:12px;border-inline-end:1px solid var(--color-border-subtle);display:flex;flex-direction:column;gap:0}
.radio{display:flex;align-items:center;gap:8px;height:28px;border:0;background:transparent;width:100%;text-align:start;padding:0 4px;border-radius:var(--radius-sm)}
.radio:hover{background:var(--color-bg-container)}
.radio i{width:16px;height:16px;border-radius:50%;border:1px solid var(--color-border-default);flex:none;display:grid;place-items:center;background:var(--color-bg-base)}
.radio[aria-checked=true] i{border-color:var(--color-brand-default)}
.radio[aria-checked=true] i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--color-brand-default)}
.cals{display:flex;gap:12px;padding:12px;flex:1;justify-content:center;flex-wrap:wrap}
.cal{width:252px}
.cal-h{display:flex;align-items:center;justify-content:space-between;height:32px;margin-bottom:4px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,32px);justify-content:space-between;row-gap:2px}
.dow{height:28px;display:grid;place-items:center;font-size:12px;color:var(--color-text-secondary)}
.day{width:32px;height:32px;border:0;background:transparent;border-radius:var(--radius-sm);display:grid;place-items:center;font-size:14px;position:relative}
.day:hover{background:var(--color-bg-container)}
.day.outside{color:var(--color-text-disabled)}
.day.today{box-shadow:inset 0 0 0 1px var(--color-action-default)}
.day.inrange{background:var(--color-brand-subtle-bg);border-radius:0}
.day.sel{background:var(--color-brand-default);color:var(--color-text-on-brand);border-radius:var(--radius-sm)}
.day:disabled{color:var(--color-text-disabled);text-decoration:line-through;cursor:not-allowed}
.range-row{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--color-border-subtle);align-items:center;flex-wrap:wrap}
.range-row .select{width:180px}.range-row .input{width:128px}
.dp-foot{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--color-border-subtle)}
.dp-foot .tz{flex:1;color:var(--color-text-secondary);font-size:12px}
.check{display:inline-flex;align-items:center;gap:8px;opacity:.6}
.check i{width:16px;height:16px;border:1px solid var(--color-border-default);border-radius:3px;background:var(--color-bg-base)}

@media (max-width:1023px){.cards,.cards.five,#reports .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){
  .presets,.cal+.cal{display:none}.dp.range{position:fixed;inset-inline:16px;top:112px;width:auto;max-width:none;max-height:calc(100vh - 128px);overflow:auto}
  .range-row .select,.range-row .input{width:100%!important}.dp.single{max-width:calc(100vw - 32px)}
  .content{padding:16px}.topbar{padding:0 16px;gap:8px}.topbar .search{width:auto;flex:1;min-width:0;max-width:none;margin-inline-end:0}
  .cards,.cards.five,#reports .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:no-preference){.menu,.dp{animation:pop .15s ease-out}@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}}

/* Notifications dropdown */
.notif-btn{position:relative}
.notif-badge{position:absolute;top:0;inset-inline-start:0;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--color-action-default);color:var(--color-text-on-action);font-size:10px;font-weight:700;line-height:16px;text-align:center}
/* Notifications panel: nav on the left, content on the right (Figma: Notifications panel 242:390) */
.menu.notif{left:0;inset-inline-start:auto;width:760px;max-width:calc(100vw - 32px);height:560px;max-height:calc(100vh - 72px);padding:0;min-width:0;display:flex;flex-direction:row;overflow:hidden}
.ntf-nav{width:176px;flex:none;display:flex;flex-direction:column;gap:4px;padding:8px;background:var(--color-bg-container);border-inline-start:1px solid var(--color-border-subtle)}
.ntf-nav .t-h5{color:var(--color-brand-default);padding:4px 8px 8px;margin:0}
.ntf-nav-item{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:0;border-radius:4px;background:transparent;color:var(--color-text-primary);font:inherit;text-align:start;width:100%;cursor:pointer}
.ntf-nav-item .lbl{flex:1}.ntf-nav-item:hover{background:var(--color-bg-tint)}
.ntf-nav-item[aria-current=true]{background:var(--color-bg-tint);color:var(--color-brand-default);font-weight:600}
.ntf-nav-item .cnt{min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--color-brand-default);color:var(--color-bg-base);font-size:11px;line-height:16px;text-align:center}
.ntf-nav-item .cnt.zero{background:var(--color-bg-tint);color:var(--color-text-secondary)}
.ntf-nav .foot{margin-top:auto;padding:8px;color:var(--color-text-secondary);font-size:12px;line-height:18px}
.ntf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ntf-head{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.ntf-head .t-h5{margin:0}.ntf-head .cnt{color:var(--color-text-secondary);font-size:12px}.ntf-head .sp{flex:1}
.ntf-main .tabs{padding:0 16px}.ntf-main .tab{padding:8px 12px}
.ntf-list{flex:1;min-height:0;overflow:auto;padding:8px;display:flex;flex-direction:column;gap:2px}
.ntf-item{display:flex;align-items:center;gap:12px;padding:8px 12px;border:0;border-radius:4px;background:transparent;font:inherit;text-align:start;width:100%;cursor:pointer;color:var(--color-text-primary)}
.ntf-item:hover,.ntf-item:focus-visible{background:var(--color-bg-container);outline:0}
.ntf-item .av{width:32px;height:32px;border-radius:16px;flex:none;display:grid;place-items:center;background:var(--color-bg-container);color:var(--color-text-secondary)}
.ntf-item .av.warning{background:var(--color-warning-bg);color:var(--color-warning-text)}.ntf-item .av.error{background:var(--color-error-bg);color:var(--color-error-text)}.ntf-item .av.orange{background:var(--color-orange-bg);color:var(--color-orange-text)}
.ntf-item .txt{flex:1;min-width:0;display:flex;flex-direction:column}.ntf-item .txt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ntf-item .txt small{color:var(--color-text-secondary);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntf-item .meta{color:var(--color-text-secondary);font-size:12px;white-space:nowrap}.ntf-item .ext{color:var(--color-text-secondary)}
.ntf-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--color-border-subtle);color:var(--color-text-secondary);font-size:12px}
.ntf-empty{padding:24px 16px}

/* Vendor late orders modal */

.dash-act{display:flex;flex-direction:column;gap:10px}
.da-row{display:flex;flex-direction:column}
.da-row small{color:var(--color-text-secondary)}
.dash-src{color:var(--color-text-secondary);margin:16px 0 0}
.dash-cust{display:flex;flex-direction:column}
.dc-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--color-border-subtle)}
.dc-row .sw-row{gap:0}.dc-row .sw-txt{display:none}
.dc-l{display:flex;flex-direction:column}
.dc-ord{display:flex;gap:2px}
.sk{background:linear-gradient(90deg,var(--color-bg-container),var(--color-bg-tint),var(--color-bg-container));background-size:200% 100%;animation:sk 1.2s linear infinite}
.sk-kpi{height:150px}.sk-card{height:280px;grid-column:span 6}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
@media (max-width:1279px){.dash-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1023px){.dash-grid{grid-template-columns:1fr}.dash-card,.sk-card{grid-column:1/-1}.dash-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dash-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin:0}
.dkv{display:flex;flex-direction:column;gap:2px;min-width:0}
.dkv dt{color:var(--color-text-secondary)}
.dkv dd{margin:0;font-weight:600;color:var(--color-text-primary)}
.dkv.neg dd{color:var(--color-error-text)}
.dkv.warn dd{color:var(--color-orange-text,var(--color-warning-text))}
.dash-name{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--color-brand-default);cursor:pointer;text-align:right;min-height:24px}
.dash-name:hover{text-decoration:underline}
.dash-name:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px;border-radius:4px}
.dn-item.tone-ok .dn-ic{background:var(--color-success-bg);color:var(--color-success-text)}
.dash-vend{display:flex;flex-direction:column;gap:12px}
/* owner 22 Oct: import modes + sheet templates */
.dx-imp{align-items:start}
.dx-mode{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dx-tplline{display:flex;align-items:center;gap:4px;color:var(--color-text-secondary)}
.dx-sheetpick{display:flex;align-items:flex-end;gap:8px}
.dx-chg{display:flex;flex-direction:column;gap:2px}
/* owner 22 Oct: «الإجراءات» menu opened from the orders page (shadow root) */
.menu.float-menu{position:fixed;z-index:1200;min-width:240px;right:auto}
.brand-cell{display:flex;flex-direction:column;gap:2px}.brand-cell b{font-weight:600}
.brands-table{width:100%;min-width:0;table-layout:auto}.brands-table td,.brands-table th{vertical-align:middle;white-space:normal;padding:8px}.brands-table th:nth-child(2),.brands-table td:nth-child(2){white-space:nowrap}.brands-table td:last-child{width:40px}
.vname-sub{display:block;font-size:12px;color:var(--color-text-secondary)}

/* floating dropdowns (ui.js floatOver): fixed above sections/drawers, above modal content */
.floating{z-index:1100;margin:0}
.floating[data-dir=up]{animation:none}

.pat-card{display:flex;gap:16px;align-items:flex-start;padding:12px;border:1px solid var(--color-border-subtle);border-radius:var(--radius-md)}
.pat-pv{position:relative;width:140px;height:160px;flex:none;border-radius:var(--radius-sm);overflow:hidden;background:var(--color-bg-tint)}
.pat-meta{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
@media (max-width:599px){.pat-card{flex-direction:column}}
/* maker login + payout (owner 26 Oct) */
.form-sec{display:flex;flex-direction:column;gap:2px;padding-top:var(--space-sm);border-top:1px solid var(--color-border-subtle,var(--color-border))}
.form-sec h3{margin:0;color:var(--color-brand-primary,var(--color-text-primary))}
.form-sec p{margin:0}
.pw-acts{display:inline-flex;gap:2px;align-items:center}
.pw-rules{display:flex;flex-wrap:wrap;gap:4px 12px;margin:-8px 0 0;padding:0;list-style:none;font-size:12px;color:var(--color-text-secondary)}
.pw-rules li::before{content:'○ ';}
.pw-rules li.ok{color:var(--color-status-success-text,var(--color-text-secondary))}
.pw-rules li.ok::before{content:'✓ ';}
.st-cell{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
/* breadcrumbs + back (owner 26 Oct) */
nav.crumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px;font-size:13px;line-height:20px}
nav.crumbs ol{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0;padding:0;list-style:none}
nav.crumbs li{display:inline-flex;align-items:center;gap:4px;color:var(--color-text-secondary)}
nav.crumbs li + li::before{content:'›';color:var(--color-text-secondary);opacity:.7}
nav.crumbs a{color:var(--color-text-secondary);text-decoration:none;border-radius:4px;padding:2px 2px}
nav.crumbs a:hover{color:var(--color-brand-primary,var(--color-text-primary));text-decoration:underline}
nav.crumbs a:focus-visible{outline:2px solid var(--color-border-focus,var(--color-brand-primary));outline-offset:1px}
nav.crumbs [aria-current=page]{color:var(--color-text-primary);font-weight:600}
nav.crumbs .crumb-back{display:inline-flex;align-items:center;gap:4px;min-height:28px;padding:0 8px;border:1px solid var(--color-border);border-radius:var(--radius-sm,4px);background:var(--color-bg-base,transparent);color:var(--color-text-primary);font:inherit;cursor:pointer}
nav.crumbs .crumb-back:hover{background:var(--color-bg-subtle,rgba(0,0,0,.04))}
@media (max-width:767px){nav.crumbs .crumb-back{min-height:44px}}
nav.crumbs{margin:0 0 -8px}
[data-genpw]{align-self:flex-start}
/* table zebra (owner 26 Oct): clear alternating rows — light beige / darker beige */
tbody tr:nth-child(odd) td{background:var(--color-bg-base)}
tbody tr:nth-child(even) td{background:var(--color-bg-tint)}

/* New modules (HR, inventory, settings, profile, login, shell) — tokens only, same names as Figma variables */
/* Logo (Figma Logo set 407:55180) */
.logo{display:block;max-width:100%;height:auto}
.logo-reversed .m{fill:var(--color-bg-layout)}.logo-reversed .g{fill:var(--color-text-gold)}
.logo-color .m{fill:var(--color-brand-default)}.logo-color .g{fill:var(--color-action-default)}
.sidebar .brand{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 8px 4px;text-decoration:none}
.sidebar .brand .logo{width:150px}
.sidebar .brand .tagline{color:var(--color-text-gold);font-size:12px;line-height:18px;font-weight:600;letter-spacing:0;opacity:1}

/* Tag/Tone (Figma 360:2518) */
.tg{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--radius-sm);border:1px solid var(--color-border-subtle);background:var(--color-bg-container);color:var(--color-text-secondary);font-size:12px;line-height:20px;font-weight:600;white-space:nowrap;vertical-align:middle}
.tg .ic{width:14px;height:14px}
.tg-success{background:var(--color-success-bg);border-color:var(--color-success-border);color:var(--color-success-text)}
.tg-brand{background:var(--color-brand-subtle-bg);border-color:var(--color-brand-default);color:var(--color-brand-default)}
.tg-info{background:var(--color-brand-subtle-bg);border-color:var(--color-border-subtle);color:var(--color-brand-default)}
.tg-gold{background:var(--color-bg-tint);border-color:var(--color-chart-2);color:var(--color-text-primary)}
.tg-orange{background:var(--color-orange-bg);border-color:var(--color-orange-border);color:var(--color-orange-text)}
.tg-error{background:var(--color-error-bg);border-color:var(--color-error-border);color:var(--color-error-text)}
.tg-neutral{background:var(--color-bg-container);border-color:var(--color-border-subtle);color:var(--color-text-secondary)}

.content.mod{display:flex;flex-direction:column;gap:16px}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.sec{padding:0;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--color-border-subtle)}
.sec-h h2{margin:0;color:var(--color-brand-default)}.sec-h .sub{color:var(--color-text-secondary)}
.sec-h .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sec-h .acts .field{min-width:160px}
.sec-b{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec-b>.scroll-x{margin:-16px;width:calc(100% + 32px);max-width:none}
.sec-b>.toolbar+.scroll-x{margin-top:0}
.help{color:var(--color-text-secondary)}
.wrap{white-space:normal;display:inline-block;max-width:280px;text-align:start}
.acts-inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.grow{flex:1}
.neg{color:var(--color-error-text)}
.b{font-weight:700}

/* Sub tabs (segmented) */
.subtabs{display:inline-flex;gap:4px;padding:4px;background:var(--color-bg-container);border-radius:var(--radius-md);flex-wrap:wrap;align-self:flex-start;max-width:100%}
.subtab{height:32px;padding:0 12px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--color-text-secondary);font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.subtab:hover{background:var(--color-bg-tint)}
.subtab[aria-selected=true]{background:var(--color-bg-base);color:var(--color-brand-default);font-weight:700;box-shadow:0 1px 2px rgba(46,42,27,.12)}
.subtab .cnt,.chip .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--color-bg-tint);color:var(--color-text-primary);font-size:12px;line-height:20px;text-align:center}
.subtab[aria-selected=true] .cnt{background:var(--color-action-default);color:var(--color-text-on-action)}

/* Switch / checkbox / radios */
.sw{width:40px;height:22px;border-radius:999px;border:0;background:var(--color-border-default);position:relative;flex:none;padding:0}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:var(--color-bg-base);transition:inset-inline-start .15s}
.sw[aria-checked=true]{background:var(--color-brand-default)}.sw[aria-checked=true] i{inset-inline-start:21px}
.sw:disabled{opacity:.5}
.sw-row,.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--color-border-subtle)}
.sec-b>.set-row:last-child,.sec-b>.sw-row:last-child{border-bottom:0}
.sw-txt{display:flex;flex-direction:column}
.cb{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:4px;border-radius:var(--radius-sm);min-height:28px}
.cb i{width:18px;height:18px;border:1px solid var(--color-border-default);border-radius:4px;background:var(--color-bg-base);display:grid;place-items:center;flex:none}
.cb[aria-checked=true] i{background:var(--color-brand-default);border-color:var(--color-brand-default);color:var(--color-text-on-brand)}
.cb i .ic{width:14px;height:14px;stroke:currentColor}
.radios{display:flex;flex-direction:column;gap:4px}
.radios .radio{height:auto;min-height:32px;flex-wrap:wrap}.radios .radio small{flex-basis:100%;padding-inline-start:24px}
.flabel{font-weight:500}

/* Accordion */
.acc{border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);overflow:hidden}
.acc+.acc{margin-top:8px}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--color-bg-container)}
.acc.open .acc-h{border-bottom:1px solid var(--color-border-subtle)}
.acc-h .meta{margin-inline-start:auto;color:var(--color-text-secondary)}
.acc-b .scroll-x{margin:0}

/* Toast */
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--color-text-primary);color:var(--color-bg-base);padding:10px 16px;border-radius:var(--radius-md);box-shadow:var(--shadow-popover);z-index:200;max-width:calc(100vw - 32px);transition:opacity .2s,transform .2s;font-weight:500}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.success{background:var(--color-brand-default);color:var(--color-text-on-brand)}
.toast.error{background:var(--color-error-text);color:var(--color-bg-base)}
@media (max-width:767px){.toast{bottom:84px}}

/* Upload field */
.sr-file{position:absolute;width:1px;height:1px;opacity:0}
.upload{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px 12px;border:1px dashed var(--color-border-default);border-radius:var(--radius-sm);background:var(--color-bg-base);cursor:pointer;color:var(--color-text-secondary);position:relative}
.upload:hover,.upload:focus-within{border-color:var(--color-brand-default)}
.upload.err{border-color:var(--color-error-base);background:var(--color-error-bg)}
.row.cols3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}
@media (max-width:767px){.row.cols3{grid-template-columns:1fr}}

/* Search field in toolbars */
.search-field{height:36px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);background:var(--color-bg-base);min-width:240px;flex:0 1 320px}
.search-field input{border:0;background:transparent;outline:0;flex:1;min-width:0}
.search-field:focus-within{outline:2px solid var(--color-border-focus)}
.toolbar .field{min-width:180px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border:1px solid var(--color-border-subtle);border-radius:999px;background:var(--color-bg-base);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.chip[aria-pressed=true]{background:var(--color-brand-default);border-color:var(--color-brand-default);color:var(--color-text-on-brand)}
.chip[aria-pressed=true] .cnt{background:var(--color-action-default);color:var(--color-text-on-action)}
.list-chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);padding:2px 2px 2px 4px;background:var(--color-bg-base)}

/* Member link / product cell */
.mlink{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:inherit;text-align:start}
.mlink span{display:flex;flex-direction:column;line-height:20px}.mlink small{color:var(--color-text-secondary);font-size:12px}
a.mlink:hover b{color:var(--color-brand-default);text-decoration:underline}
.avatar.sm{width:28px;height:28px}
.avatar.xl{width:64px;height:64px;font-size:26px;flex:none}
.prod{display:flex;align-items:center;gap:8px;text-align:start}.prod>span:last-child{display:flex;flex-direction:column;line-height:20px}.prod small{color:var(--color-text-secondary);font-size:12px}
.thumb{width:36px;height:36px;border-radius:var(--radius-sm);background:var(--color-bg-tint);display:grid;place-items:center;color:var(--color-brand-default);flex:none}
.prod.lg .thumb{width:56px;height:56px}
.thumb{overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.late{color:var(--color-error-text);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.oid{font-weight:700;color:var(--color-brand-default);text-decoration:none}

/* Team calendar */
.legend{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw-off{padding:0 8px;border-radius:var(--radius-sm);background:var(--color-bg-tint)}
.tcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:640px}
.cal-hd{padding:6px;text-align:center;color:var(--color-text-primary);background:var(--color-bg-tint);border-radius:var(--radius-sm)}
.cal-cell{min-height:84px;border:1px solid var(--color-border-subtle);border-radius:var(--radius-sm);padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--color-bg-base);align-items:flex-start}
.cal-cell.out{background:transparent;border-style:dashed}
.cal-cell.off{background:var(--color-bg-tint)}
.cal-cell.today{outline:2px solid var(--color-action-default)}
.cal-cell .d{font-weight:700}
.sec-b:has(.tcal){overflow-x:auto}

/* Payslip */
.slip{display:flex;flex-direction:column;gap:4px}
.slip-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:8px;border-bottom:1px solid var(--color-border-subtle)}
.slip-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--color-border-subtle)}
.slip-row.total{border-bottom:0;border-top:2px solid var(--color-brand-default);margin-top:8px;padding-top:10px;font-size:16px;color:var(--color-brand-default)}
.score-box{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;border-radius:var(--radius-sm);background:var(--color-bg-container)}
.countdown{display:flex;align-items:center;gap:8px;justify-content:center;font-size:28px;line-height:40px;color:var(--color-brand-default);padding:8px 0}
.codes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.codes code{padding:6px 8px;background:var(--color-bg-container);border-radius:var(--radius-sm);text-align:center;font-size:14px}

/* Consolidation card */
.cons{padding:16px;display:flex;flex-direction:column;gap:12px}
.cons.is-late{border:2px solid var(--color-error-border)}
.cons-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.cons-subs{display:flex;flex-direction:column;gap:6px}
.cons-sub{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--color-bg-container);border-radius:var(--radius-sm);flex-wrap:wrap}
.cnt-in{width:72px;height:32px;border:1px solid var(--color-border-default);border-radius:var(--radius-sm);text-align:center;background:var(--color-bg-base)}

/* Settings */
.set-layout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;align-items:start}
.set-nav{padding:8px;display:flex;flex-direction:column;gap:2px;position:sticky;top:64px}
.set-nav-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:0;background:transparent;border-radius:var(--radius-sm);text-align:start;color:var(--color-text-primary)}
.set-nav-item .ic{margin-top:4px;color:var(--color-text-secondary)}
.set-nav-item span{display:flex;flex-direction:column;line-height:20px}.set-nav-item small{color:var(--color-text-secondary);font-size:12px}
.set-nav-item:hover{background:var(--color-bg-container)}
.set-nav-item[aria-current=page]{background:var(--color-brand-subtle-bg);box-shadow:inset -3px 0 0 var(--color-action-default)}
.set-nav-item[aria-current=page] b,.set-nav-item[aria-current=page] .ic{color:var(--color-brand-default)}
.set-body{display:flex;flex-direction:column;gap:16px;min-width:0;max-width:920px}
.save-bar{position:sticky;bottom:16px;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;background:var(--color-text-primary);color:var(--color-bg-base);border-radius:var(--radius-md);box-shadow:var(--shadow-popover);flex-wrap:wrap}
.save-bar>span{display:inline-flex;align-items:center;gap:8px}
.danger-zone{padding:16px;border:2px solid var(--color-error-border);display:flex;flex-direction:column;gap:8px}.danger-zone h2{margin:0;color:var(--color-error-text)}
.integ{padding:16px;display:flex;flex-direction:column;gap:12px}.integ-h{display:flex;align-items:center;gap:12px}.integ-h>div{flex:1}
.steps{display:flex;gap:8px;list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{flex:1;padding:6px;border-bottom:3px solid var(--color-border-subtle);color:var(--color-text-secondary);font-size:12px;counter-increment:s}
.steps li::before{content:counter(s) '. '}
.steps li.on{border-color:var(--color-action-default);color:var(--color-text-primary);font-weight:700}.steps li.done{border-color:var(--color-brand-default)}
.inline-sel .field{min-width:150px}.inline-sel .select{height:32px}
.pm{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:var(--radius-sm);border:1px solid var(--color-border-subtle);background:var(--color-bg-base);font-weight:700}
.legend .pm{min-width:auto;padding:0 8px;gap:4px;display:inline-flex}
.pm-full{color:var(--color-success-text);background:var(--color-success-bg);border-color:var(--color-success-border)}
.pm-part{color:var(--color-text-primary);background:var(--color-bg-tint);border-color:var(--color-chart-2)}
.pm-none{color:var(--color-text-disabled)}
.pm.sens{color:var(--color-error-text);border-color:var(--color-error-border);background:var(--color-error-bg)}
button.pm:disabled{opacity:.7;cursor:not-allowed}
.matrix{min-width:860px;display:flex;flex-direction:column}
.mx-row{display:grid;grid-template-columns:220px repeat(var(--cols),minmax(64px,1fr));align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid var(--color-border-subtle);text-align:center}
.mx-row>span:first-child{text-align:start;display:flex;align-items:center;gap:6px}
.mx-row.sens>span:first-child{color:var(--color-error-text)}

<script>/* Ibtekr Accounts — domain layer. Pure functions only: no DOM, no I/O, no globals.

(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.IbtekrDomain = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const CATEGORIES = Object.freeze(['المرتبات', 'المصروفات', 'الاشتراكات', 'الإعلانات']);
  const VENDOR_TYPES = Object.freeze(['مواصلات', 'عربون', 'أخرى']);
  const ACCOUNTS = Object.freeze(['حساب البنك', 'حساب بوسطة', 'حساب باي موب', 'محفظة إلكترونية']);
  const OTHER = 'آخر';
  const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const MAX_AMOUNT = 1e9;

  const toLatinDigits = (s) => String(s)
    .replace(/[٠-٩]/g, (c) => String(c.charCodeAt(0) - 0x660))
    .replace(/[۰-۹]/g, (c) => String(c.charCodeAt(0) - 0x6f0));
  const round2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;

  function sanitizeText(s, max) {

  }

  function parseAmount(raw) {
    const s = toLatinDigits(raw == null ? '' : raw).replace(/٬|,/g, '').replace(/٫/g, '.').trim();
    if (!/^\d+(\.\d+)?$/.test(s)) return NaN;
    return round2(Number(s));
  }
  function formatMoney(n) {
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function formatPct(fraction) { return (fraction * 100).toFixed(1) + '%'; }

  // ---- dates (ISO yyyy-mm-dd built from UTC parts, never from local time) ----
  const pad = (n) => String(n).padStart(2, '0');
  const iso = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
  function isoToUtc(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
  function utcToIso(ms) { const t = new Date(ms); return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); }
  const addDays = (s, n) => utcToIso(isoToUtc(s) + n * 86400000);
  function parseDate(raw) {
    const m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(toLatinDigits(raw == null ? '' : raw).trim());

  // weekday index with Saturday = 0
  const satIndex = (s) => (new Date(isoToUtc(s)).getUTCDay() + 1) % 7;

  function presetRange(key, today) {
    const [y, m] = today.split('-').map(Number);
    switch (key) {
      case 'today': return { from: today, to: today };
      case 'yesterday': { const d = addDays(today, -1); return { from: d, to: d }; }

      errs = VD.validateVendor(f);
      if (!existing) { Object.assign(errs, VD.validateLogin(f)); if (!errs.username && vstore.usernameTaken(f.username)) errs.username = 'اسم المستخدم ده مستخدم قبل كده — جرّب ' + VD.suggestUsername(f.username, (u) => vstore.usernameTaken(u)); if (canBank && (bankReq || f.method)) Object.assign(errs, VD.validateBank(f)); }
      if (Object.keys(errs).length) { errs._form = 'راجع الحقول المعلّمة بالأحمر'; draw(); const bad = modal.el.querySelector('[aria-invalid=true]'); if (bad) bad.focus(); return; }
      if (!existing) { f.login = { username: f.username, pwMode: f.pwMode, password: f.password }; f.bank = canBank && f.method ? { method: f.method, bankName: f.bankName, holder: f.holder, iban: f.iban, wallet: f.wallet } : null; }
      try { if (existing) { vstore.update(existing.id, f, ME); log.append({ action: 'vendor.update', actor: ME.name, newValue: existing.id }); modal.close(); vnotify('success', 'اتحفظت بيانات ' + f.name + '.'); if (vdrawer) openVendor(existing.id); }
        else { const v = vstore.create(f, ME); log.append({ action: 'vendor.create', actor: ME.name, newValue: v.id }); modal.close(); state.vfilter.q = ''; vnotify('success', 'اتضاف المبتكر ' + v.name + ' (' + v.id + ') · ' + (f.pwMode === 'temp' ? 'الباسورد المؤقت جاهز تبعته له' : 'اتبعت لينك التفعيل على ' + f.email) + '.'); f.password = ''; openVendor(v.id); } }
      catch (e) { errs._form = e.message; draw(); }
    }
    modal = U.Modal({ title: existing ? 'تعديل بيانات ' + existing.name : 'إضافة مبتكر', body: [], footer: [] }); draw(); const first = modal.el.querySelector('#v-name'); if (first) first.focus();
  }


  const LS = { none: 'مفيش حساب', invited: 'مستني التفعيل', active: 'مفعّل', disabled: 'موقوف' };
  function card(v) {
    const L0 = v.login || {}; const pwBox = h('span', { class: 'pw-cell' }, h('span', { dir: 'ltr', class: 'pw-val' }, L0.hasVault ? '••••••••' : (L0.inviteSentAt ? 'لينك التفعيل اتبعت' : '—')), L0.hasVault ? Button({ type: 'text', size: 'sm', label: 'إظهار', onClick: (e) => { const p = vstore.revealPassword(v.id, ME); pwBox.querySelector('.pw-val').textContent = p; e.currentTarget.remove(); } }) : null);

    return h('section', { class: 'card sa-card', id: 'row-' + v.id }, h('div', { class: 'sa-head' }, U.VendorLogo({ letter: v.name, size: 'md' }), h('div', null, h('b', null, v.name), h('small', { class: 't-small help', style: 'display:block' }, v.id + ' · ' + v.category + ' · ' + v.rate + '%')), h('span', { class: 'tg tg-' + ({ active: 'success', invited: 'gold', disabled: 'error' }[L0.status] || 'neutral') }, LS[L0.status] || LS.none)),
      row('اسم المستخدم', L0.username ? h('span', { dir: 'ltr' }, L0.username) : null), row('الإيميل', v.email ? h('span', { dir: 'ltr' }, v.email) : null), row('الباسورد', pwBox), row('الحساب البنكي', bank),
      Button({ size: 'sm', icon: 'copy', label: 'انسخ بيانات الدخول للمبتكر', onClick: () => { const pw = L0.hasVault ? vstore.revealPassword(v.id, ME) : null; copyText(['اسم المستخدم: ' + L0.username, 'الإيميل: ' + v.email, pw ? 'الباسورد المؤقت: ' + pw : 'لينك التفعيل: اتبعت على الإيميل'].join('\n'), 'بيانات الدخول'); } }));
  }
  function render() {
    const list = vstore.all().reverse();
    document.getElementById('app').replaceChildren(h('div', { class: 'sa-top' }, h('div', null, h('h1', { class: 't-h3' }, 'المبتكرين'), h('p', { class: 't-small help', style: 'margin:0' }, 'نموذج «إضافة مبتكر» — البيانات الأساسية + بيانات الدخول + الحساب البنكي')), Button({ type: 'brand', icon: 'plus', label: 'إضافة مبتكر', onClick: () => openAddVendor() })),
      h('div', { class: 'sa-list' }, list.map(card)), h('p', { class: 't-small help' }, 'موجودين قبل كده عشان تجرّب منع تكرار اسم المستخدم: antikiano و bian.eg. اكتب اسم «Antikiano» وشوف الاقتراح.'));
